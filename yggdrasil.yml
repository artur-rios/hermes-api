# What Jenkins checks for this repository, read by the pipeline of the yggdrasil installation that deploys it
# (yggdrasil's docs/catalog.md, "Repository pipeline file", has every field). The commands are scripts under ci/ that
# run from the repository's root, so you can run them on your own machine too.
#
# Check it where the catalog is, in the yggdrasil checkout:
#   python3 scripts/pipeline_config.py describe hermes-api <this repository's checkout>

checks:
  test:                                  # restore, build, unit and functional tests, the coverage floor (ci/test.sh)
    image: mcr.microsoft.com/dotnet/sdk:10.0.404@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb
    run: ci/test.sh
    archive: "artifacts/coverage/**"     # the coverage report
  docker:                                # the container image can still be built (ci/docker.sh)
    image: docker:29.7.2-cli@sha256:3f4743208d2338c934d7b8bcfbe1bb54c0b2355c510ad5e0f31c0c4a54bd704e
    run: ci/docker.sh
    docker: true                         # the CI engine's socket: the image is built by it
